risk:
  max_position_size_pct: 10
  max_exposure_pct: 80
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  default_risk_budget_pct: 10
  # Exit strategy configuration
  exit_strategy: "atr"  # "fixed_pct", "atr", "partial_trail"
  stop_loss_default_pct: 1.5  # used only if exit_strategy == "fixed_pct"
  take_profit_default_pct: 3.0  # used only if exit_strategy == "fixed_pct"
  atr_multiplier_sl: 2.0  # for atr strategy
  atr_multiplier_tp: 4.0  # for atr strategy
  partial_target_pct: 0.02  # for partial_trail strategy (2% gain)
  trail_stop_multiplier: 1.5  # for partial_trail, ATR multiplier for trailing stop
  max_concurrent_positions: 25
  min_position_size_usd: 100
  approval_required_pct: 0.75
  allow_short_selling: false
  margin_enabled: false

# Explicit strategy definitions for StrategyAgent
strategies:
  sma20_trend:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 1.0
    entry_rules:
      - name: price_above_sma20
        type: entry
        indicator: sma_20
        condition: greater_than
        value: 0.0
        compare_to_price: true
    exit_rules:
      - name: price_below_sma20
        type: exit
        indicator: sma_20
        condition: less_than
        value: 0.0
        compare_to_price: true

  sma50_trend_regime:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 1.0
    entry_rules:
      - name: price_above_sma50
        type: entry
        indicator: sma_50
        condition: greater_than
        value: 0.0
        compare_to_price: true
      - name: regime_bullish
        type: entry
        indicator: regime_score
        condition: greater_than
        value: 50.0
    exit_rules:
      - name: price_below_sma50
        type: exit
        indicator: sma_50
        condition: less_than
        value: 0.0
        compare_to_price: true
      - name: regime_bearish
        type: exit
        indicator: regime_score
        condition: less_than
        value: 30.0

strategy:
  type: sma50_trend_regime
  enable_intraday_entries: true  # Tier 2: evaluate BUY entries every 15 min (in addition to daily Tier 1 scan)
  auto_execute:
    enabled: true
    confidence_threshold: 0.8
    require_approval: false
  indicators:
    sma:
      enabled: true
      periods:
      - 20
      - 50
  rules:
    price_above_sma50: true
    regime_bullish: true
    stop_loss_enabled: true
    take_profit_enabled: true

risk:
  max_position_size_pct: 10.0
  max_exposure_pct: 80
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  default_risk_budget_pct: 1.0
  stop_loss_default_pct: 1.5
  take_profit_default_pct: 3.0
  max_concurrent_positions: 10
  min_position_size_usd: 100
  allow_short_selling: false
  margin_enabled: false
strategies:
  momentum_trend:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 0.7
    entry_rules:
    - name: rsi_bullish
      type: entry
      indicator: rsi
      condition: greater_than
      value: 55.0
    - name: macd_bullish_entry
      type: entry
      indicator: macd
      condition: greater_than
      value: 0.0
    exit_rules:
    - name: rsi_overbought_exit
      type: exit
      indicator: rsi
      condition: greater_than
      value: 65.0
    - name: macd_bearish_exit
      type: exit
      indicator: macd
      condition: less_than
      value: 0.0
  momentum_trend_filtered:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 0.7
    entry_rules:
    - name: rsi_bullish
      type: entry
      indicator: rsi
      condition: greater_than
      value: 55.0
    - name: macd_bullish_entry
      type: entry
      indicator: macd
      condition: greater_than
      value: 0.0
    - name: price_above_sma200
      type: entry
      indicator: sma_200
      condition: greater_than
      value: 0.0
      compare_to_price: true
    exit_rules:
    - name: rsi_overbought_exit
      type: exit
      indicator: rsi
      condition: greater_than
      value: 65.0
    - name: macd_bearish_exit
      type: exit
      indicator: macd
      condition: less_than
      value: 0.0
  value_quality_news:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 0.6
    entry_rules:
    - name: pe_value
      type: entry
      indicator: pe_ratio
      condition: less_than
      value: 60.0
    - name: revenue_growth
      type: entry
      indicator: revenue_growth_yoy
      condition: greater_than
      value: 0.1
    - name: news_sentiment_bullish
      type: entry
      indicator: news_sentiment
      condition: greater_than
      value: 0.1
    exit_rules:
    - name: pe_overvalued
      type: exit
      indicator: pe_ratio
      condition: greater_than
      value: 100.0
    - name: revenue_shrink
      type: exit
      indicator: revenue_growth_yoy
      condition: less_than
      value: 0.0
    - name: news_bearish
      type: exit
      indicator: news_sentiment
      condition: less_than
      value: -0.2
  momentum_lenient:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 0.5
    entry_rules:
    - name: rsi_bullish
      type: entry
      indicator: rsi
      condition: greater_than
      value: 55.0
    - name: macd_bullish_entry
      type: entry
      indicator: macd
      condition: greater_than
      value: 0.0
    exit_rules:
    - name: rsi_overbought_exit
      type: exit
      indicator: rsi
      condition: greater_than
      value: 70.0
    - name: macd_bearish_exit
      type: exit
      indicator: macd
      condition: less_than
      value: 0.0
  sma20_trend:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 1.0
    entry_rules:
    - name: price_above_sma20
      type: entry
      indicator: sma_20
      condition: greater_than
      value: 0.0
      compare_to_price: true
    exit_rules:
    - name: price_below_sma20
      type: exit
      indicator: sma_20
      condition: less_than
      value: 0.0
      compare_to_price: true
  sma50_trend:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 1.0
    entry_rules:
    - name: price_above_sma50
      type: entry
      indicator: sma_50
      condition: greater_than
      value: 0.0
      compare_to_price: true
    exit_rules:
    - name: price_below_sma50
      type: exit
      indicator: sma_50
      condition: less_than
      value: 0.0
      compare_to_price: true
  sma50_trend_regime:
    allocation: 1.0
    risk_budget_pct: 1.5
    confidence_threshold: 1.0
    entry_rules:
    - name: price_above_sma50
      type: entry
      indicator: sma_50
      condition: greater_than
      value: 0.0
      compare_to_price: true
    - name: regime_bullish
      type: entry
      indicator: regime_score
      condition: greater_than
      value: 50.0
    exit_rules:
    - name: price_below_sma50
      type: exit
      indicator: sma_50
      condition: less_than
      value: 0.0
      compare_to_price: true
    - name: regime_bearish
      type: exit
      indicator: regime_score
      condition: less_than
      value: 30.0
strategy:
  type: sma20_trend
  auto_execute:
    enabled: true
    confidence_threshold: 0.8
    require_approval: false
  indicators:
    rsi:
      enabled: true
      period: 14
      oversold: 40
      overbought: 65
    macd:
      enabled: true
      fast_period: 12
      slow_period: 26
      signal_period: 9
    sma:
      enabled: true
      periods:
      - 10
      - 20
      - 50
    atr:
      enabled: true
      period: 14
  rules:
    rsi_entry_oversold: true
    rsi_entry_oversold_threshold: 40
    macd_crossover: true
    price_above_sma10: true
    rsi_exit_overbought: true
    rsi_exit_overbought_threshold: 65
    macd_signal_exit: true
    stop_loss_enabled: true
    take_profit_enabled: true

data:
  default_interval: 1d
  default_lookback_days: 120
  cache_ttl_minutes: 5
  cache_enabled: true
  batch_size: 20
  batch_delay_sec: 1.0
  request_jitter_sec: 0.5
  backoff:
    enabled: true
    initial_wait_sec: 1
    max_wait_sec: 60
    multiplier: 2.0
  cache_ttl_market_hours: 30
  cache_ttl_after_hours: 15
  cache_ttl_weekend: 60
  cache_volatility_invalidation:
    enabled: true
    price_change_threshold_pct: 2.0
performance:
  max_workers: 4
  verbose: false
  log_trades: true
  buffer_batch_inserts: true
  buffer_size: 100
  api_timeout_sec: 30
  api_retries: 3
portfolio:
  initial_cash: 100000
  base_currency: USD
  reset_on_startup: false
  archive_trades_on_reset: true
  auto_rebalance_enabled: false
  rebalance_frequency: monthly
scheduler:
  market_scan_interval_minutes: 15
  data_refresh_interval_minutes: 5

# Market scanner settings
market_scan:
  limit: 100  # Scan all symbols (universe size ~25)


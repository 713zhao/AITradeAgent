scheduler:
  price_monitor_interval: 900
  discovery_schedule: "0 9 * * MON-FRI"
  regime_check_interval: 3600

telegram:
  token_env: "TELEGRAM_BOT_TOKEN"
  chat_id: "YOUR_CHAT_ID"
  parse_mode: "MarkdownV2"

# LLM Configuration (OpenRouter)
llm:
  enabled: true
  provider: "openrouter"
  api_key_env: "OPENROUTER_API_KEY"
  base_url: null
  model: "openrouter/auto"
  timeout: 30
  max_retries: 3
  modules:
    news_sentiment:
      enabled: false
      model: "openrouter/auto"
      temperature: 0.4
    market_regime:
      enabled: false
      model: "openrouter/auto"
      temperature: 0.3

# Symbol Selector Agent (LLM-powered ranking)
symbol_selector:
  enabled: true
  max_input_symbols: 50
  top_n_per_theme: 5
  cache_ttl_hours: 24
  model: "openrouter/auto"
  temperature: 0.2
  position_size_pct: 2.0

# Market Regime Agent (broad market context)
market_regime_agent:
  enabled: true
  cache_ttl_minutes: 60
  indices:
    SP500:
      symbol: "^GSPC"
      name: "S&P 500"
    NASDAQ:
      symbol: "^IXIC"
      name: "NASDAQ Composite"
    DOW:
      symbol: "^DJI"
      name: "Dow Jones Industrial"
    VIX:
      symbol: "^VIX"
      name: "CBOE Volatility Index"
    RUSSELL2000:
      symbol: "^RUT"
      name: "Russell 2000"

# Macro News Agent (market-wide news)
macro_news_agent:
  enabled: true
  lookback_hours: 48
  max_articles: 20
  cache_ttl_minutes: 360
  cache_path: "finance_service/storage/macro_news_cache.sqlite"


    cache_ttl_minutes: 1440
    cache_ttl_weekend: 60
    batch_size: 10
    batch_delay_sec: 0.5
    request_jitter_sec: 0.5
    backoff:
      initial_wait_sec: 1
      max_wait_sec: 30
      multiplier: 2.0
    performance:
      api_retries: 3
      api_timeout_sec: 30

  notifications:
    telegram:
      enabled: true

finance:
  risk:
    max_position_size_pct: 10.0
    max_exposure_pct: 80
    max_daily_loss_pct: 2.0
    max_drawdown_pct: 15.0
    default_risk_budget_pct: 1.0
    stop_loss_default_pct: 1.5
    take_profit_default_pct: 3.0
    max_concurrent_positions: 10
    min_position_size_usd: 100
    allow_short_selling: false
    margin_enabled: false

  # Explicit strategy definitions for StrategyAgent
  strategies:
    sma20_trend:
      allocation: 1.0
      risk_budget_pct: 1.5
      confidence_threshold: 1.0
      entry_rules:
        - name: price_above_sma20
          type: entry
          indicator: sma_20
          condition: greater_than
          value: 0.0
          compare_to_price: true
      exit_rules:
        - name: price_below_sma20
          type: exit
          indicator: sma_20
          condition: less_than
          value: 0.0
          compare_to_price: true

  strategy:
    type: sma20_trend
    auto_execute:
      enabled: true
      confidence_threshold: 0.8
      require_approval: false
    indicators:
      rsi:
        enabled: true
        period: 14
        oversold: 40
        overbought: 65
      macd:
        enabled: true
        fast_period: 12
        slow_period: 26
        signal_period: 9
      sma:
        enabled: true
        periods:
          - 10
          - 20
          - 50
      atr:
        enabled: true
        period: 14
    rules:
      rsi_entry_oversold: true
      rsi_entry_oversold_threshold: 40
      macd_crossover: true
      price_above_sma10: true
      rsi_exit_overbought: true
      rsi_exit_overbought_threshold: 65
      macd_signal_exit: true
      stop_loss_enabled: true
      take_profit_enabled: true

  universe:

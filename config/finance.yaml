# OpenClaw Finance Agent - Finance Configuration
# Version: 1.0
# Last Updated: 2026-03-20

# ========================
# RISK CONFIGURATION
# ========================
risk:
  # Position sizing
  max_position_size_pct: 25          # Max % of portfolio per trade (aggressive)
  max_exposure_pct: 95               # Max % total deployed
  max_daily_loss_pct: 4.0            # Daily loss stop
  max_drawdown_pct: 15.0             # Max drawdown stop
  
  # Risk per trade
  default_risk_budget_pct: 1.5       # 1.5% risk per trade
  stop_loss_default_pct: 1.5         # ATR-based stop multiplier
  take_profit_default_pct: 3.0       # Take profit at 3x stop (2:1 R:R)
  
  # Position limits
  max_concurrent_positions: 10
  min_position_size_usd: 100
  allow_short_selling: false
  margin_enabled: false

# ========================
# STRATEGY CONFIGURATION
# ========================
strategy:
  type: "baseline_rule"
  
  auto_execute:
    enabled: true
    confidence_threshold: 0.40       # Lower threshold for more signals
    require_approval: false          # Auto-execute without manual wait
  
  indicators:
    rsi:
      enabled: true
      period: 14
      oversold: 40
      overbought: 65
    
    macd:
      enabled: true
      fast_period: 12
      slow_period: 26
      signal_period: 9
    
    sma:
      enabled: true
      periods: [10, 20, 50]          # Fast SMA for trend filter
    
    atr:
      enabled: true
      period: 14
  
  rules:
    # Entry rules
    rsi_entry_oversold: true
    rsi_entry_oversold_threshold: 40
    macd_crossover: true
    price_above_sma10: true          # Require fast uptrend
    
    # Exit rules
    rsi_exit_overbought: true
    rsi_exit_overbought_threshold: 65
    macd_signal_exit: true
    
    # Risk management
    stop_loss_enabled: true
    take_profit_enabled: true

# ========================
# UNIVERSE CONFIGURATION
# ========================
universe:
  # Theme-based scanning
  themes:
    - name: "AI"
      symbols:
        - NVDA
        - PLTR
        - UPST
        - AVGO
        - MSTR
    - name: "Semiconductor"
      symbols:
        - TSM
        - QCOM
        - AMD
        - ASR
        - ASML
    - name: "Cloud"
      symbols:
        - CRWD
        - DDOG
        - NET
        - MDB
        - SNOW
    - name: "MegaCap"
      symbols:
        - MSFT
        - GOOGL
        - AAPL
        - AMZN
        - META
  
  # All symbols list (for whitelist and manual selection)
  all_symbols:
    - NVDA
    - PLTR
    - UPST
    - AVGO
    - MSTR
    - TSM
    - QCOM
    - AMD
    - ASR
    - ASML
    - CRWD
    - DDOG
    - NET
    - MDB
    - SNOW
    - MSFT
    - GOOGL
    - AAPL
    - AMZN
    - META
  
  # Whitelist mode
  whitelist:
    enabled: false
    symbols: []

# ========================
# DATA CONFIGURATION
# ========================
data:
  default_interval: "1day"
  default_lookback_days: 252
  cache_ttl_minutes: 1440
  cache_enabled: true
  batch_size: 10
  batch_delay_sec: 0.5
  request_jitter_sec: 0.5
  backoff:
    enabled: true
    initial_wait_sec: 1
    max_wait_sec: 30
    multiplier: 2.0

# ========================
# PERFORMANCE
# ========================
performance:
  max_workers: 4
  verbose: false
  log_trades: true
  buffer_batch_inserts: true
  buffer_size: 100
  api_timeout_sec: 30
  api_retries: 3

# ========================
# PORTFOLIO INITIALIZATION
# ========================
portfolio:
  initial_cash: 100000
  base_currency: "USD"
  reset_on_startup: false
  archive_trades_on_reset: true
  auto_rebalance_enabled: false
  rebalance_frequency: "monthly"

# ========================
# SCHEDULER SETTINGS
# ========================
scheduler:
  market_scan_interval_minutes: 15
  data_refresh_interval_minutes: 5

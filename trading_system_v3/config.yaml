universe:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - TSLA
  - AVGO

scan_limit: 8
lookback_days: 250
starting_cash: 100000.0
db_path: storage/portfolio.sqlite
strategy_memory_db_path: storage/strategy_actor.sqlite
risk_memory_db_path: storage/risk_actor.sqlite
learning_memory_db_path: storage/learning_actor.sqlite
scan_interval_minutes: 15
run_learning_after_each_cycle: true

risk:
  max_position_weight: 0.15
  max_positions: 12
  min_confidence: 0.55
  max_daily_loss_pct: 0.03
  cooldown_minutes_after_loss: 60
  default_stop_loss_pct: 0.08

llm:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  base_url: null
  api_key_env: OPENAI_API_KEY

broker:
  slippage_bps: 5.0
  commission_bps: 1.0
